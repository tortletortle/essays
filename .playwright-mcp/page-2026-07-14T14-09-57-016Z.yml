                - generic [ref=f21e470]:
                  - 'heading "🚀 Novel-Claude V3: Agentic Novel Generation Framework" [level=1] [ref=f21e471]'
                  - 'link "Permalink: 🚀 Novel-Claude V3: Agentic Novel Generation Framework" [ref=f21e472] [cursor=pointer]':
                    - /url: "#-novel-claude-v3-agentic-novel-generation-framework"
                - paragraph [ref=f21e475]:
                  - link "简体中文" [ref=f21e476] [cursor=pointer]:
                    - /url: /wzxsph/Novel-Claude/blob/main/README.md
                  - text: "|"
                  - link "English" [ref=f21e477] [cursor=pointer]:
                    - /url: /wzxsph/Novel-Claude/blob/main/README_EN.md
                  - text: "|"
                  - link "日本語" [ref=f21e478] [cursor=pointer]:
                    - /url: /wzxsph/Novel-Claude/blob/main/README_JP.md
                - generic [ref=f21e479]:
                  - paragraph [ref=f21e480]: Warning
                  - paragraph [ref=f21e483]:
                    - strong [ref=f21e484]: 本项目还处于测试阶段，还有诸多功能不完善，请谨慎使用。
                - paragraph [ref=f21e485]:
                  - text: Novel-Claude 是一个基于大语言模型（如智谱 GLM-4）构建的全自动长篇小说生成管线。在 V3 版本中，它从传统的线性脚本流水线彻底进化为具有极高扩展性的
                  - strong [ref=f21e486]: 微内核 + 插件生态架构 (Microkernel & Plugin Architecture)
                  - text: 。
                - paragraph [ref=f21e487]:
                  - text: 通过底层的
                  - code [ref=f21e488]: EventBus
                  - text: 事件引擎与动态
                  - code [ref=f21e489]: PluginManager
                  - text: ，它支持极其复杂的社区插件生态（Skills）以及基于 ReAct 多轮交互的复杂智能体（Agents）。
                - generic [ref=f21e490]:
                  - heading "✨ 核心特性" [level=2] [ref=f21e491]
                  - 'link "Permalink: ✨ 核心特性" [ref=f21e492] [cursor=pointer]':
                    - /url: "#-核心特性"
                - list [ref=f21e495]:
                  - listitem [ref=f21e496]:
                    - strong [ref=f21e497]: 微内核插件系统 (Microkernel & Plugin Ecosystem)
                    - text: ": 所有的附加功能（如动态检索记忆 RAG、战斗合理性检测等）被剥离为主时间线之外的插件（Skills）。支持热重载（Hot-Reload）与错误护航隔离，单个插件崩溃不影响数小时的生成进程。"
                  - listitem [ref=f21e498]:
                    - strong [ref=f21e499]: 复杂智能体支撑 (Complex Agents)
                    - text: ":"
                    - list [ref=f21e500]:
                      - listitem [ref=f21e501]:
                        - text: 🖋️
                        - strong [ref=f21e502]: Editor Agent (毒舌主编智能体)
                        - text: ": 在章节生成末尾挂载，启用 ReAct 多轮循环思考对草稿进行严格审稿，自动修复视角跳跃和上下文割裂。"
                      - listitem [ref=f21e503]:
                        - text: 🤖
                        - strong [ref=f21e504]: Skill Builder Agent (元生成器)
                        - text: ": 系统级别的 Meta-Generation。在 CLI 中输入一行自然语言，系统将"
                        - strong [ref=f21e505]: 自动撰写并编译合法外挂插件 (Skills)
                        - text: 落盘生效。
                  - listitem [ref=f21e506]:
                    - strong [ref=f21e507]: 降本提效 (Batch API)
                    - text: ": 原生支持智谱/OpenAI 格式的 Batch API 提交流水线，支持离线 5 折并发生成海量章节，并自动拼接、回调。"
                - separator [ref=f21e508]
                - generic [ref=f21e509]:
                  - heading "🏗️ 架构总览" [level=2] [ref=f21e510]
                  - 'link "Permalink: 🏗️ 架构总览" [ref=f21e511] [cursor=pointer]':
                    - /url: "#️-架构总览"
                - paragraph [ref=f21e514]:
                  - text: 整个生成管线被切分为三大核心引擎，引擎之间通过
                  - code [ref=f21e515]: NovelContext
                  - text: 共享白板及
                  - code [ref=f21e516]: EventBus
                  - text: 广播串行：
                - list [ref=f21e517]:
                  - listitem [ref=f21e518]:
                    - code [ref=f21e519]: world_builder.py
                    - text: "(世界观造物主): 根据一句话创意（Logline），构建严格 JSON 格式的背景设定、阵营、人物列表。"
                  - listitem [ref=f21e520]:
                    - code [ref=f21e521]: volume_planner.py
                    - text: "(分卷派单员): 定制 10 卷纲要，并将大段卷纲拆解为精准到场景的小说打点（Beats），且通过算法强制归一化控制为每章 5000 字精确产出。"
                  - listitem [ref=f21e522]:
                    - code [ref=f21e523]: scene_writer.py
                    - text: "(执笔车间): 孵化 Subagents 无死角执行场景任务，并交由 Director Agent 进行定稿。"
                - generic [ref=f21e524]:
                  - code [ref=f21e526]: "novel_claude/ ├── core/ # 发动机微内核 │ ├── event_bus.py # 全局事件总线（Fault Tolerance） │ ├── plugin_manager.py # 动态插件扫描与加载器 │ ├── base_skill.py # V3 标准化插件基类 │ ├── novel_context.py # 共享生命周期上下文 │ └── agents/ # 复杂推理智能体 │ ├── editor_agent.py # 毒舌主编 ReAct Agent │ └── skill_builder_agent.py # Meta-Generation 元生成器 ├── skills/ # 插件挂载文件夹（放入即生效） │ └── core_memory_rag/ # 原生的 RAG 记忆流媒体检索插件 ├── world_builder.py # 核心引擎一：设定构建 ├── volume_planner.py # 核心引擎二：分卷与场景切分 ├── scene_writer.py # 核心引擎三：片段执笔与合并 ├── cli.py # 终端入口 └── utils/ # 配置文件与 LLM 客户端 API 层"
                  - button "Copy code to clipboard" [ref=f21e528] [cursor=pointer]
                - separator [ref=f21e532]
